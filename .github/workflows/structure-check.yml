name: Repository Structure Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required repository root files
        run: |
          missing=0

          for file in README.md eda.ipynb requirements.txt; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required root file: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Repository root must contain README.md, eda.ipynb, and requirements.txt."
            exit 1
          fi

          echo "✅ Required repository root files are present."
